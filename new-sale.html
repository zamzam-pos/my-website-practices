<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Sale</title>

<!-- ============================================================
     NEW SALE - a simple, beginner-friendly billing screen.
     One file. No libraries. Just HTML + CSS + a little JavaScript.

     How this file is organised:
       1. <style>  - how everything looks (colours, layout)
       2. <body>   - the things you see (header, item cards, bill)
       3. <script> - what happens when you click (add item, totals)
     ============================================================ -->

<style>
  /* ---------- 1. COLOURS AND BASIC SETTINGS ----------
     Change a colour here and it changes everywhere. */
  :root {
    --main:   #0b6e86;   /* buttons and highlights */
    --gold:   #8a4b00;   /* price text */
    --gold-bg:#fdf0dc;   /* price box background */
    --bg:     #f0f4f5;   /* page background */
    --card:   #ffffff;   /* white boxes */
    --line:   #dfe7ea;   /* thin borders */
    --text:   #0f1c24;   /* normal text */
    --grey:   #6b7c86;   /* small grey text */
    --green:  #0a845a;
    --red:    #cc3e39;
  }

  * { box-sizing: border-box; }            /* makes widths easier to predict */
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ---------- TOP BAR: customer, mobile, invoice, date ---------- */
  .top {
    display: flex;
    flex-wrap: wrap;          /* wrap to next line on small screens */
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border-bottom: 3px solid var(--main);
  }
  .top label { font-size: 13px; font-weight: bold; }
  .top input {
    display: block;
    margin-top: 4px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
  }

  /* ---------- MAIN AREA: items on the left, bill on the right ---------- */
  .main {
    display: flex;
    gap: 16px;
    padding: 16px;
    flex-wrap: wrap;
  }
  .box {                       /* a white card */
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .items { flex: 1 1 380px; padding: 12px; }
  .bill  { flex: 1 1 460px; }

  /* ---------- ITEM CARDS (left side) ---------- */
  .items h2, .bill h2 { margin: 0 0 10px; font-size: 16px; }
  .bill h2 {
    text-align: center;
    padding: 12px;
    margin: 0;
    background: #f6f9fa;
    border-bottom: 1px solid var(--line);
    border-radius: 10px 10px 0 0;
  }
  #search {
    width: 100%;
    padding: 9px 10px;
    margin-bottom: 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .card {
    text-align: left;
    padding: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .card:hover { border-color: var(--main); }
  .card small { color: var(--grey); display: block; }
  .card b { display: block; margin: 4px 0; font-size: 14px; }
  .card .price { color: var(--gold); font-weight: bold; font-size: 15px; }
  .stock {
    float: right;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    background: #e2f3eb;
    color: var(--green);
  }
  .stock.low { background: #fbe9e8; color: var(--red); }

  /* ---------- BILL TABLE (right side) ---------- */
  #quick {
    width: calc(100% - 24px);
    margin: 12px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    background: #f6f9fa;
    padding: 8px 6px;
    text-align: left;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .num { text-align: right; }
  td input {                     /* the small qty and rate boxes */
    width: 64px;
    padding: 6px;
    text-align: right;
    border: 1px solid var(--line);
    border-radius: 5px;
  }
  td input.rate { background: var(--gold-bg); color: var(--gold); font-weight: bold; }
  .remove { border: 0; background: none; color: var(--grey); font-size: 18px; cursor: pointer; }
  .remove:hover { color: var(--red); }
  .empty { text-align: center; color: var(--grey); padding: 24px; }

  /* ---------- TOTALS (bottom of the bill) ---------- */
  .totals { padding: 12px 16px; background: #f6f9fa; border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; font-size: 14px; }
  .row input {
    width: 90px;
    padding: 5px;
    text-align: right;
    border: 1px solid var(--line);
    border-radius: 5px;
  }
  .grand {
    margin-top: 6px;
    padding-top: 8px;
    border-top: 1px dashed #b5c3c9;
    font-size: 20px;
    font-weight: bold;
  }
  .due { color: var(--red); font-weight: bold; }
  #save {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 0 0 10px 10px;
    background: var(--main);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  #save:hover { background: #095c70; }
</style>
</head>

<body>

<!-- ---------- 2. WHAT YOU SEE ---------- -->

<!-- Top bar -->
<div class="top">
  <label>Customer <input id="customer" placeholder="Customer name"></label>
  <label>Mobile   <input id="mobile"   placeholder="Phone number"></label>
  <label>Invoice No <input id="invoice" value="INV-0001"></label>
  <label>Date <input id="date" type="date"></label>
</div>

<div class="main">

  <!-- LEFT: item cards. The cards are made by JavaScript below. -->
  <div class="box items">
    <h2>Items</h2>
    <input id="search" placeholder="Search items...">
    <div class="cards" id="cards"></div>
  </div>

  <!-- RIGHT: the bill -->
  <div class="box bill">
    <h2>Sales Bill</h2>

    <input id="quick" placeholder="Type item name and press Enter to add...">

    <table>
      <thead>
        <tr>
          <th>S.No.</th>
          <th>Item Name</th>
          <th class="num">Qty</th>
          <th class="num">Incl. Tax (₹)</th>
          <th class="num">Without Tax</th>
          <th class="num">Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="billRows"></tbody>
    </table>

    <div class="totals">
      <div class="row"><span>Subtotal</span>          <span id="subtotal">₹0.00</span></div>
      <div class="row"><span>CGST (9%) Included:</span><span id="cgst">₹0.00</span></div>
      <div class="row"><span>SGST (9%) Included:</span><span id="sgst">₹0.00</span></div>
      <div class="row"><span>Discount (₹):</span>     <input id="discount" type="number" min="0" value="0"></div>
      <div class="row grand"><span>Grand Total:</span> <span id="grand">₹0.00</span></div>
      <div class="row"><span>Customer Paid (₹):</span> <input id="paid" type="number" min="0" value="0"></div>
      <div class="row"><span>Balance Due:</span>       <span id="balance" class="due">₹0.00</span></div>
    </div>

    <button id="save">Save Bill</button>
  </div>
</div>


<!-- ---------- 3. WHAT HAPPENS WHEN YOU CLICK ---------- -->
<script>
  // --- A. The list of items you sell. Add or edit your own here! ---
  // price = selling price INCLUDING 18% GST.
  var items = [
    { code: "tnr 0.5",   name: "Thinner 1/2L",       hsn: "3814", price: 80,   stock: 58 },
    { code: "rdoxd 0.5", name: "Red oxide 500ml",    hsn: "3206", price: 150,  stock: 4  },
    { code: "wmpr10",    name: "Walmasta primer 10L", hsn: "3209", price: 1500, stock: 2  },
    { code: "bslt10",    name: "Bison lite 10L",     hsn: "3209", price: 1850, stock: 6  },
    { code: "wmlt10",    name: "Walmasta lite 10L",  hsn: "3209", price: 1700, stock: 9  }
  ];

  // --- B. The bill. Each line is { item, qty, price } ---
  var bill = [];

  // Helper: turn a number into money text, like 1234.5 -> "₹1234.50"
  function money(n) {
    return "₹" + n.toFixed(2);
  }

  // Helper: find an element by its id (shorter to type)
  function $(id) {
    return document.getElementById(id);
  }

  // --- C. Draw the item cards on the left ---
  function showCards() {
    var text = $("search").value.toLowerCase();   // what you typed in the search box
    var html = "";

    for (var i = 0; i < items.length; i++) {
      var it = items[i];

      // skip items that don't match the search
      var words = (it.name + " " + it.code + " " + it.hsn).toLowerCase();
      if (words.indexOf(text) === -1) continue;

      var low = it.stock <= 5;                    // "low stock" if 5 or less
      html += '<button class="card" onclick="addItem(' + i + ')">' +
                '<small>' + it.code + '</small>' +
                '<b>' + it.name + '</b>' +
                '<small>HSN: ' + it.hsn + '</small>' +
                '<span class="price">' + money(it.price) + '</span>' +
                '<span class="stock ' + (low ? "low" : "") + '">' +
                   (low ? "Low: " : "Stock: ") + it.stock + '</span>' +
              '</button>';
    }
    $("cards").innerHTML = html;
  }

  // --- D. Add an item to the bill (click a card, or use the quick box) ---
  function addItem(index) {
    // if the item is already on the bill, just increase the quantity
    for (var i = 0; i < bill.length; i++) {
      if (bill[i].item === index) {
        bill[i].qty = bill[i].qty + 1;
        showBill();
        return;
      }
    }
    // otherwise add a new line
    bill.push({ item: index, qty: 1, price: items[index].price });
    showBill();
  }

  // --- E. Remove a line from the bill ---
  function removeLine(lineNumber) {
    bill.splice(lineNumber, 1);      // delete 1 line at this position
    showBill();
  }

  // --- F. When you type a new qty or price in the bill ---
  function changeLine(lineNumber, field, value) {
    bill[lineNumber][field] = Number(value) || 0;
    showTotals();                    // only totals change, so no need to redraw rows
    updateRowTotals();
  }

  // --- G. Draw the bill table ---
  function showBill() {
    var html = "";

    if (bill.length === 0) {
      html = '<tr><td colspan="7" class="empty">No items selected</td></tr>';
    }

    for (var i = 0; i < bill.length; i++) {
      var line = bill[i];
      var it = items[line.item];
      html += '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td><b>' + it.name + '</b><br><small style="color:#6b7c86">HSN: ' + it.hsn + '</small></td>' +
        '<td class="num"><input type="number" min="0" value="' + line.qty +
             '" onchange="changeLine(' + i + ',\'qty\',this.value)"></td>' +
        '<td class="num"><input class="rate" type="number" min="0" value="' + line.price +
             '" onchange="changeLine(' + i + ',\'price\',this.value)"></td>' +
        '<td class="num" id="wt' + i + '"></td>' +
        '<td class="num" id="lt' + i + '"></td>' +
        '<td><button class="remove" onclick="removeLine(' + i + ')">×</button></td>' +
        '</tr>';
    }
    $("billRows").innerHTML = html;

    updateRowTotals();
    showTotals();
  }

  // --- H. Fill in "Without Tax" and "Total" for each line ---
  function updateRowTotals() {
    for (var i = 0; i < bill.length; i++) {
      var total = bill[i].qty * bill[i].price;      // price already includes GST
      var withoutTax = total / 1.18;                // remove 18% GST
      $("wt" + i).innerHTML = money(withoutTax);
      $("lt" + i).innerHTML = money(total);
    }
  }

  // --- I. Work out the bottom totals ---
  function showTotals() {
    var sum = 0;                                    // total of all lines (with GST)
    for (var i = 0; i < bill.length; i++) {
      sum = sum + bill[i].qty * bill[i].price;
    }

    var discount = Number($("discount").value) || 0;
    if (discount > sum) discount = sum;             // discount can't be more than the bill

    var grand = sum - discount;                     // what the customer must pay
    var withoutTax = grand / 1.18;                  // amount before GST
    var gst = grand - withoutTax;                   // total GST inside the amount

    var paid = Number($("paid").value) || 0;
    var balance = grand - paid;
    if (balance < 0) balance = 0;

    $("subtotal").innerHTML = money(withoutTax);
    $("cgst").innerHTML     = money(gst / 2);       // CGST is half of the GST
    $("sgst").innerHTML     = money(gst / 2);       // SGST is the other half
    $("grand").innerHTML    = money(grand);
    $("balance").innerHTML  = money(balance);
  }

  // --- J. Save button ---
  $("save").onclick = function () {
    if (bill.length === 0) {
      alert("Please add at least one item.");
      return;
    }
    alert("Bill saved!\n\nCustomer: " + ($("customer").value || "-") +
          "\nInvoice: " + $("invoice").value +
          "\nGrand Total: " + $("grand").innerHTML);
    // Later you can send this data to a server or save it in the browser.
  };

  // --- K. Connect the boxes so the screen updates while you type ---
  $("search").oninput   = showCards;
  $("discount").oninput = showTotals;
  $("paid").oninput     = showTotals;

  // Quick box: type a name and press Enter to add the first matching item
  $("quick").onkeydown = function (e) {
    if (e.key !== "Enter") return;
    var text = this.value.toLowerCase();
    for (var i = 0; i < items.length; i++) {
      if ((items[i].name + " " + items[i].code).toLowerCase().indexOf(text) !== -1) {
        addItem(i);
        this.value = "";
        return;
      }
    }
    alert("No item found.");
  };

  // --- L. Start: put today's date in the Date box and draw the screen ---
  $("date").value = new Date().toISOString().slice(0, 10);
  showCards();
  showBill();
</script>

</body>
</html>
