<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,500..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Anek Latin","Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F0F4F5; --surface:#FFFFFF; --surface-2:#F6F9FA; --surface-3:#EAF0F2;
  --border:#DFE7EA; --border-strong:#C6D2D7;
  --text:#0F1C24; --text-2:#465863; --text-3:#7A8C96;
  --brand:#0B6E86; --brand-600:#095C70; --brand-700:#07495A; --brand-50:#E4F1F4; --brand-100:#C8E3EA; --on-brand:#FFFFFF;
  --deep:#06394A; --deep-2:#0A5F76;
  --accent:#F0A02E; --accent-50:#FDF0DC; --accent-ink:#8A4B00;
  --green:#0A845A; --green-50:#E2F3EB;
  --red:#CC3E39; --red-50:#FBE9E8;
  --amber:#B0600A; --amber-50:#FCEEDB;
  --violet:#6450C6; --violet-50:#EDEAFA;
  --blue:#2964C6; --blue-50:#E7EEFA;
  --rose:#BB3D64; --rose-50:#F9E7EE;
  --c-sales:#0A7FA0; --c-costs:#C77710;
  --age1:#6FB7CB; --age2:#3E9CB5; --age3:#1B7F99; --age4:#0E6178; --age5:#0A4556;
  --side:#062630; --side-text:#B4C9D0; --side-mute:#62858F;
  --shadow-sm:0 1px 2px rgba(15,28,36,.05),0 1px 3px rgba(15,28,36,.04);
  --shadow-md:0 8px 20px -10px rgba(15,28,36,.22);
  --shadow-lg:0 24px 48px -12px rgba(15,28,36,.32);
  --r-lg:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#081216; --surface:#0E1B21; --surface-2:#12232A; --surface-3:#182C34;
    --border:#1E323B; --border-strong:#2A444F;
    --text:#E3ECEF; --text-2:#A2B3BB; --text-3:#6E838D;
    --brand:#3DB4D0; --brand-600:#62C3DA; --brand-700:#93D7E7; --brand-50:rgba(61,180,208,.12); --brand-100:rgba(61,180,208,.24); --on-brand:#03222B;
    --deep:#07303D; --deep-2:#0B4E60;
    --accent:#F2B04A; --accent-50:rgba(242,176,74,.14); --accent-ink:#F6C57A;
    --green:#3CC98F; --green-50:rgba(60,201,143,.13);
    --red:#F07068; --red-50:rgba(240,112,104,.13);
    --amber:#EDA64B; --amber-50:rgba(237,166,75,.14);
    --violet:#A493F4; --violet-50:rgba(164,147,244,.14);
    --blue:#72A4F4; --blue-50:rgba(114,164,244,.14);
    --rose:#EE82A3; --rose-50:rgba(238,130,163,.14);
    --c-sales:#2596B3; --c-costs:#C98019;
    --age1:#1E6C80; --age2:#2B8DA6; --age3:#3DB4D0; --age4:#7ACFE2; --age5:#B5E6F0;
    --side:#041B22; --side-text:#A4BCC4; --side-mute:#50707B;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 8px 20px -10px rgba(0,0,0,.6); --shadow-lg:0 24px 48px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#081216; --surface:#0E1B21; --surface-2:#12232A; --surface-3:#182C34;
  --border:#1E323B; --border-strong:#2A444F;
  --text:#E3ECEF; --text-2:#A2B3BB; --text-3:#6E838D;
  --brand:#3DB4D0; --brand-600:#62C3DA; --brand-700:#93D7E7; --brand-50:rgba(61,180,208,.12); --brand-100:rgba(61,180,208,.24); --on-brand:#03222B;
  --deep:#07303D; --deep-2:#0B4E60;
  --accent:#F2B04A; --accent-50:rgba(242,176,74,.14); --accent-ink:#F6C57A;
  --green:#3CC98F; --green-50:rgba(60,201,143,.13);
  --red:#F07068; --red-50:rgba(240,112,104,.13);
  --amber:#EDA64B; --amber-50:rgba(237,166,75,.14);
  --violet:#A493F4; --violet-50:rgba(164,147,244,.14);
  --blue:#72A4F4; --blue-50:rgba(114,164,244,.14);
  --rose:#EE82A3; --rose-50:rgba(238,130,163,.14);
  --c-sales:#2596B3; --c-costs:#C98019;
  --age1:#1E6C80; --age2:#2B8DA6; --age3:#3DB4D0; --age4:#7ACFE2; --age5:#B5E6F0;
  --side:#041B22; --side-text:#A4BCC4; --side-mute:#50707B;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow-md:0 8px 20px -10px rgba(0,0,0,.6); --shadow-lg:0 24px 48px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 14.5px/1.5 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.icon{width:18px;height:18px;flex:none;display:block}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--text-3)}
.dec{font-size:.6em;font-weight:700;opacity:.72;letter-spacing:0;margin-left:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (max-width:640px){.hide-m{display:none!important}}
@media (min-width:641px){.show-m{display:none!important}}

/* ---------- Shell ---------- */
.side{display:none}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--accent);color:#3A2100}
.mark .icon{width:21px;height:21px}
.brandname{font:700 20px/1.05 var(--display);font-stretch:87.5%;letter-spacing:.01em}
.bizname{font-size:12px;font-weight:600;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text-3);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-50);flex:none}
.sync.local::before{background:var(--amber);box-shadow:0 0 0 3px var(--amber-50)}
.sync.err::before{background:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.sync.wait::before{background:var(--text-3);box-shadow:none}
.sync.dot{font-size:0;gap:0;padding:0 6px}
.mhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:11px;padding:10px 8px 10px 16px;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--border)}
.mhead .mark{width:34px;height:34px;border-radius:10px}
.mhead .grow{flex:1;min-width:0}
.ibtn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--text-2);display:grid;place-items:center;flex:none}
.ibtn:hover{background:var(--surface-3);color:var(--text)}
.ibtn .icon{width:20px;height:20px}
.ibtn.wa-i{color:var(--green)}
.content{padding:16px 16px calc(124px + env(safe-area-inset-bottom,0px));max-width:1240px;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-top:1px solid var(--border)}
.bnav>button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:11px;font-weight:700;color:var(--text-3)}
.bnav>button .icon{width:22px;height:22px}
.bnav>button[aria-current="page"]{color:var(--brand)}
.fabslot{position:relative}
.fab{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:56px;height:56px;border-radius:18px;border:0;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);box-shadow:0 12px 24px -10px color-mix(in srgb,var(--brand) 80%,transparent),0 2px 4px rgba(0,0,0,.08)}
.fab .icon{width:26px;height:26px}
@media (min-width:1024px){
  .mhead,.bnav{display:none}
  .side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:248px;background:var(--side);color:var(--side-text);padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:25}
  .main{margin-left:248px}
  .content{padding:4px 32px 64px}
}
.side .brandrow{display:flex;align-items:center;gap:11px;padding:0 6px 20px}
.side .brandname{color:#fff}
.side .bizname{color:var(--side-mute);max-width:150px}
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;margin:0 2px 6px;border:0;border-radius:12px;background:var(--accent);color:#3A2100;font-weight:800;font-size:14px}
.newbtn:hover{filter:brightness(1.06)}
.navsec{font-size:11.5px;font-weight:700;color:var(--side-mute);padding:18px 12px 6px;letter-spacing:.03em}
.sidenav button{width:100%;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--side-text);font-weight:600;font-size:14px;text-align:left;margin:1px 0}
.sidenav button .icon{color:var(--side-mute)}
.sidenav button:hover{background:rgba(255,255,255,.06);color:#fff}
.sidenav button[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
.sidenav button[aria-current="page"] .icon{color:var(--accent)}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:rgba(240,112,104,.2);color:#FFA49D;font-size:11.5px;font-weight:800;display:grid;place-items:center}
.badge.warn{background:rgba(242,176,74,.18);color:#F7C774}
.sidefoot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px}
.sidefoot .sync{color:var(--side-mute);padding:0 12px}
.topbar{display:none}
@media (min-width:1024px){
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:68px;padding:0 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px)}
  .topbar .grow{flex:1}
}
.gsearch{display:flex;align-items:center;gap:10px;flex:0 1 440px;height:42px;padding:0 10px 0 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text-3);box-shadow:var(--shadow-sm);font-weight:600;text-align:left}
.gsearch span{flex:1}
.gsearch:hover{border-color:var(--border-strong)}
kbd{font:700 11px var(--font);padding:3px 7px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-3)}

/* ---------- Page ---------- */
.crumb{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--text-2);font-weight:700;font-size:13px;padding:0;margin:8px 0 2px}
.crumb:hover{color:var(--brand)}
.crumb .icon{width:16px;height:16px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin:10px 0 18px}
.ph-t{min-width:0}
.ph h1{font-family:var(--display);font-stretch:87.5%;font-weight:700;font-size:31px;line-height:1.12;letter-spacing:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hello{font-size:13px;font-weight:700;color:var(--text-3);margin-bottom:3px}
.ph .sub{color:var(--text-2);margin-top:4px}
.ph-a{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.st{font-family:var(--font);font-stretch:100%}
@media (max-width:640px){
  .ph{margin:6px 0 14px}
  .ph h1{font-size:26px}
  .ph-a{width:100%}
  .ph-a>.btn{flex:1}
  .ph-a>.btn.icon-only{flex:none}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none;box-shadow:var(--shadow-sm);transition:background-color .15s,border-color .15s,transform .06s}
.btn:hover{background:var(--surface-2);border-color:var(--text-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-600);border-color:var(--brand-600)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-50);border-color:var(--red)}
.btn.soft{background:var(--brand-50);border-color:transparent;color:var(--brand-700);box-shadow:none}
.btn.soft:hover{background:var(--brand-100)}
.btn.wa{background:#117A46;border-color:#117A46;color:#fff}
.btn.wa:hover{background:#0D6A3C;border-color:#0D6A3C}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.icon-only{width:40px;padding:0}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn .icon{width:17px;height:17px}
.link{display:inline;background:none;border:0;padding:0;color:var(--brand);font-weight:700;font-size:inherit;text-align:left}
.link:hover{text-decoration:underline}
.card-h>.link{font-size:13px;white-space:nowrap;margin-top:2px}

/* Cards and grids */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:16px 18px 6px}
.card-h h2{font-size:15.5px;font-weight:800}
.card-h .muted{font-size:12.5px;font-weight:600;color:var(--text-3);margin-top:1px}
.card-ha{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.card-b{padding:10px 18px 18px}
.card-h+.twrap,.card-h+.cl{margin-top:10px;border-top:1px solid var(--border)}
.cl .lr{padding-left:18px;padding-right:18px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g75{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g84{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1100px){.g75,.g84{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.grid{gap:12px;margin-bottom:12px}}

/* Hero: the one bold panel */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 22px 22px;color:#fff;display:flex;flex-direction:column;min-height:216px;background:radial-gradient(110% 90% at 100% 0%,rgba(240,160,46,.26),rgba(240,160,46,0) 55%),linear-gradient(150deg,var(--deep) 0%,var(--deep-2) 100%);box-shadow:0 18px 36px -22px rgba(6,57,74,.9)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 28px);pointer-events:none}
.hero>*{position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .lab{font-size:13.5px;font-weight:700;color:rgba(255,255,255,.82)}
.hbtn{display:inline-flex;align-items:center;gap:2px;border:0;border-radius:999px;background:rgba(255,255,255,.13);color:#fff;font-weight:700;font-size:12.5px;height:28px;padding:0 8px 0 12px}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn .icon{width:15px;height:15px}
.hero-mid{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,40%);gap:8px 18px;align-items:end;margin-top:6px}
.hero .big{font-size:clamp(34px,8.6vw,48px);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:2px 0 8px;overflow-wrap:anywhere}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:24px}
.hdelta{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 9px 0 6px;border-radius:999px;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.14);color:#fff}
.hdelta .icon{width:15px;height:15px}
.hdelta.up .icon{color:#86E8BD} .hdelta.down .icon{color:#FFA9A2}
.hcmp{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.72)}
.spark{position:relative;height:84px;pointer-events:none}
.spark svg{display:block;width:100%;height:100%;overflow:visible}
.spark .sa{fill:rgba(240,160,46,.18);stroke:none}
.spark .sl{fill:none;stroke:#F2B04A;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sdot{position:absolute;width:10px;height:10px;border-radius:50%;background:#F2B04A;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.hstats{display:flex;gap:10px 30px;flex-wrap:wrap;margin-top:auto;padding-top:20px}
.hstats span{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.68)}
.hstats b{font-size:16px;font-weight:800;letter-spacing:-.01em}
@media (max-width:640px){
  .hero{padding:18px 18px 20px;border-radius:20px;min-height:0}
  .hero-mid{grid-template-columns:minmax(0,1fr)}
  .spark{height:52px;margin:4px 0 0}
  .hstats{gap:8px 22px;padding-top:16px}
  .hstats b{font-size:15px}
}

/* Balance tiles */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:hidden}
.kpi{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:16px 18px;border:0;border-top:1px solid var(--border);border-left:1px solid var(--border);margin:-1px 0 0 -1px;background:none;text-align:left;color:inherit;min-width:0}
.kpi:hover{background:var(--surface-2)}
.kt{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--text-2)}
.kpi .kval{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.2;overflow-wrap:anywhere}
.kpi .kf{font-size:12.5px;font-weight:600;color:var(--text-3);margin-top:-3px}
@media (max-width:640px){.kpi{padding:14px}.kpi .kval{font-size:18px}.kt{font-size:12.5px;gap:8px}.kt .ib{width:30px;height:30px;border-radius:9px}.kt .ib .icon{width:16px;height:16px}}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ib .icon{width:18px;height:18px}
.ib.lg{width:44px;height:44px;border-radius:13px}
.ib.lg .icon{width:22px;height:22px}
.ib.xl{width:64px;height:64px;border-radius:19px}
.ib.xl .icon{width:28px;height:28px}
.ib.sm{width:28px;height:28px;border-radius:8px}
.ib.sm .icon{width:15px;height:15px}
.ib.brand{background:var(--brand-50);color:var(--brand)} .ib.green{background:var(--green-50);color:var(--green)} .ib.red{background:var(--red-50);color:var(--red)} .ib.amber{background:var(--amber-50);color:var(--amber)} .ib.violet{background:var(--violet-50);color:var(--violet)} .ib.blue{background:var(--blue-50);color:var(--blue)} .ib.rose{background:var(--rose-50);color:var(--rose)} .ib.gray{background:var(--surface-3);color:var(--text-2)}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text-2);padding:4px 0;min-width:0}
.qa .ib{width:54px;height:54px;border-radius:17px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.qa .ib .icon{width:23px;height:23px}

/* Summary strip */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden;margin-bottom:14px}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* Toolbar */

.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{height:32px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--text-2);font-weight:700;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;flex:none}

.tabs2 .n{font-size:11px;font-weight:800;color:var(--text-3);background:var(--surface);border:1px solid var(--border);min-width:20px;padding:0 6px;border-radius:999px;line-height:17px;text-align:center}

/* Status chips, avatars */
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 8px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;vertical-align:middle;line-height:1;letter-spacing:0}

.st.low{color:var(--red);background:var(--red-50)} .st.svc{color:var(--violet);background:var(--violet-50)} .st.neutral{color:var(--text-2);background:var(--surface-3)} .st.neutral::before{display:none}

.empty{padding:36px 20px;text-align:center;color:var(--text-3)}

/* Charts */
.legend{display:flex;gap:6px 14px;font-size:12.5px;font-weight:700;color:var(--text-2);flex-wrap:wrap;align-items:center}

.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}

.chartwrap{position:relative;min-height:240px;touch-action:pan-y;border-radius:8px;outline-offset:4px}
.chart{display:block;width:100%;height:auto;overflow:visible}

.ctip{position:absolute;top:0;transform:translate(-50%,-8px);pointer-events:none;background:var(--text);color:var(--surface);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:600;box-shadow:var(--shadow-lg);white-space:nowrap;z-index:2;font-variant-numeric:tabular-nums}

/* Bill editor: line items */
.lines{margin:0;counter-reset:ln}
.lhead,.line{display:grid;grid-template-columns:26px minmax(0,1fr) 62px 86px 84px 28px;gap:8px 8px;align-items:start}
.lhead{align-items:center;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);padding:10px 12px;background:var(--surface-2);border-block:1px solid var(--border);position:sticky;top:0;z-index:2}
.lhead .n{text-align:right}
.line{counter-increment:ln;padding:10px 12px 12px;border-bottom:1px solid var(--border);transition:background-color .15s}
.line:hover,.line:focus-within{background:color-mix(in srgb,var(--brand) 3%,var(--surface))}
.line::before{content:counter(ln);display:grid;place-items:center;width:24px;height:38px;font-size:12.5px;font-weight:800;color:var(--text-3);font-variant-numeric:tabular-nums}
.line .c{display:flex;flex-direction:column;gap:4px;min-width:0}
.line .c>span{display:none;font-size:11px;font-weight:700;color:var(--text-3)}

.line .c-amt{text-align:right;padding-top:9px;font-variant-numeric:tabular-nums}

.line .c-del{border:0;background:none;color:var(--text-3);font-size:20px;line-height:1;height:38px;width:28px;border-radius:9px}
.line .c-del:hover{color:var(--red);background:var(--red-50)}
.ln-sub{grid-column:2/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ln-sub .c>span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.ln-sub input,.ln-sub select{height:32px;font-size:12.5px;border-radius:8px;background:var(--surface-2)}
.li-hint{grid-column:1/-1;font-size:11.5px;font-weight:600;color:var(--text-3);min-height:0}

/* Point-of-sale layout: item cards on the left, the bill on the right */

/* Small screens: comfortable touch targets */

@media (prefers-reduced-motion:reduce){

@page{size:A4;margin:14mm}

<script>
'use strict';
/* =========================================================

   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pad=n=>String(n).padStart(2,'0');
const ymd=(y,m,d)=>{const t=new Date(y,m,d);return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;};
const todayStr=()=>{const t=new Date();return ymd(t.getFullYear(),t.getMonth(),t.getDate());};
const addDays=(s,n)=>{const [y,m,d]=String(s).split('-').map(Number);return ymd(y,m-1,d+n);};
const dayNum=s=>Math.floor(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5);
const daysBetween=(a,b)=>dayNum(b)-dayNum(a);
const fmtDate=s=>{ if(!s||s.length<10||s.startsWith('0000')||s.startsWith('9999')) return ''; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtDay=s=>{ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); };
const nf2=new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const nfq=new Intl.NumberFormat('en-IN',{maximumFractionDigits:3});
const money=p=>((p||0)<0?'−':'')+'₹'+nf2.format(Math.abs(p||0)/100);
const plain=p=>((p||0)<0?'-':'')+nf2.format(Math.abs(p||0)/100);
const qty=n=>nfq.format(n||0);
const moneyShort=p=>{ const r=Math.abs(p||0)/100, s=(p||0)<0?'−':''; if(r>=1e7) return s+'₹'+(r/1e7).toFixed(r>=1e8?0:1).replace(/\.0$/,'')+'Cr'; if(r>=1e5) return s+'₹'+(r/1e5).toFixed(r>=1e6?0:1).replace(/\.0$/,'')+'L'; if(r>=1e3) return s+'₹'+(r/1e3).toFixed(r>=1e4?0:1).replace(/\.0$/,'')+'K'; return s+'₹'+Math.round(r); };
const toPaise=v=>{ const s=String(v??'').replace(/[,₹\s]/g,''); if(s==='') return 0; const n=Number(s); return Number.isFinite(n)?Math.round(n*100):NaN; };
const toNum=v=>{ const s=String(v??'').replace(/[,\s]/g,''); if(s==='') return 0; const n=Number(s); return Number.isFinite(n)?n:NaN; };
const rupeesInput=p=>p?(p/100).toFixed(2).replace(/\.00$/,''):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sumBy=(a,f)=>a.reduce((t,x)=>t+(f(x)||0),0);
const byDate=(a,b)=>(a.date||'').localeCompare(b.date||'')||((a.createdAt||0)-(b.createdAt||0));
const inR=(d,r)=>!!d&&d>=r.from&&d<=r.to;

const plural=(n,w,ws)=>`${qty(n)} ${n===1?w:(ws||w+'s')}`;

function inWords(paise){
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=n=>n<20?ones[n]:tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
  const three=n=>{const h=Math.floor(n/100),r=n%100;return (h?ones[h]+' Hundred'+(r?' ':''):'')+(r?two(r):'');};
  const words=n=>{ if(n===0) return 'Zero'; const out=[]; const cr=Math.floor(n/1e7); n%=1e7; const lk=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3;
    if(cr) out.push(words(cr)+' Crore'); if(lk) out.push(two(lk)+' Lakh'); if(th) out.push(two(th)+' Thousand'); if(n) out.push(three(n)); return out.join(' '); };
  const neg=paise<0; paise=Math.abs(Math.round(paise||0));
  const r=Math.floor(paise/100), p=paise%100;
  return (neg?'Minus ':'')+'Rupees '+words(r)+(p?' and '+two(p)+' Paise':'')+' Only';
}

const stateName=c=>(STATES.find(s=>s[0]===c)||[])[1]||'';

/* =========================================================
   Storage: shared db when this page runs on Claude,
   browser storage otherwise. Money is always whole paise.
   ========================================================= */
const COLLS=['invoices','purchases','payments','expenses','parties','products'];
const Store={
  db:null, mode:'loading', ready:false, ver:0,
  data:Object.fromEntries(COLLS.map(c=>[c,[]])),
  settings:{},
  async init(){
    let db=null;
    try{ db=(window.claude&&typeof window.claude.use==='function')?await window.claude.use('db'):null; }catch(e){ db=null; }
    if(db){
      this.db=db; this.mode='online';
      let waiting=COLLS.length+1;
      const done=()=>{ if(!this.ready&&--waiting<=0){ this.ready=true; scheduleRender(); } };
      const fail=e=>{ this.mode='error'; setSync(); toast(e&&e.code==='revoked'?'Access to these books changed. Reload the page to continue.':'Live sync stopped. Reload the page to reconnect.'); };
      COLLS.forEach(c=>{
        let first=true;
        db.collection(c).onSnapshot(s=>{ this.data[c]=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})); this.ver++; if(first){first=false;done();} scheduleRender(); },fail);
      });
      let firstS=true;
      db.doc('settings/business').onSnapshot(s=>{ this.settings=s.exists?Object.assign({},s.data()):{}; this.ver++; if(firstS){firstS=false;done();} applyChrome(); scheduleRender(); },fail);
      setTimeout(()=>{ if(!this.ready){ this.ready=true; scheduleRender(); } },9000);
    } else {
      this.mode='local'; this.loadLocal(); this.ready=true; this.ver++;
    }
    setSync(); applyChrome(); scheduleRender();
  },
  loadLocal(){
    try{
      const raw=localStorage.getItem('khata-v2');
      if(raw){ const o=JSON.parse(raw); COLLS.forEach(c=>{ this.data[c]=Array.isArray(o.data&&o.data[c])?o.data[c]:[]; }); this.settings=o.settings||{}; return; }
      const v1=localStorage.getItem('khata-v1');
      if(v1){ const o=JSON.parse(v1); this.data.invoices=o.invoices||[]; this.data.payments=o.payments||[]; this.saveLocal(); }
    }catch(e){}
  },
  saveLocal(){ try{ localStorage.setItem('khata-v2',JSON.stringify({data:this.data,settings:this.settings})); }catch(e){ toast('This browser couldn’t save your books. Free up storage and try again.'); } },
  touch(){ this.ver++; this.saveLocal(); scheduleRender(); },
  newId(c){ return this.db?this.db.collection(c).doc().id:'l'+uid(); },
  async put(c,id,obj){
    const body=JSON.parse(JSON.stringify(obj)); delete body.id;
    if(this.db){ await this.db.doc(c+'/'+id).set(body); }
    else { const arr=this.data[c]; const i=arr.findIndex(x=>x.id===id); const rec=Object.assign(body,{id}); if(i>=0) arr[i]=rec; else arr.push(rec); this.touch(); }
    return id;
  },
  async add(c,obj){ if(obj.createdAt==null) obj.createdAt=Date.now(); return this.put(c,this.newId(c),obj); },
  async patch(c,id,p){
    if(this.db){ await this.db.doc(c+'/'+id).update(JSON.parse(JSON.stringify(p))); }
    else { const r=this.data[c].find(x=>x.id===id); if(r){ Object.assign(r,p); this.touch(); } }
  },
  async remove(c,id){
    if(this.db){ await this.db.doc(c+'/'+id).delete(); }
    else { this.data[c]=this.data[c].filter(x=>x.id!==id); this.touch(); }
  },
  async saveSettings(s){
    const body=JSON.parse(JSON.stringify(s));
    if(this.db){ await this.db.doc('settings/business').set(body); }
    else { this.settings=body; this.touch(); applyChrome(); }
  },
  async clearSettings(){
    if(this.db){ await this.db.doc('settings/business').delete(); }
    else { this.settings={}; this.touch(); applyChrome(); }
  }
};

/* =========================================================
   Tax maths
   ========================================================= */
function calcTotals(items,{inclusive=false,igst=false,roundOff=false}={}){
  const lines=items.map(it=>{
    const g=Number(it.gst)||0;
    const gross=Math.round((Number(it.qty)||0)*(Number(it.rate)||0));
    const d=Math.min(100,Math.max(0,Number(it.disc)||0));
    const after=Math.round(gross*(1-d/100));
    const taxable=inclusive?Math.round(after*100/(100+g)):after;
    return Object.assign({},it,{gst:g,gross,discAmt:gross-after,taxable,lineTax:Math.round(taxable*g/100)});
  });
  const map=new Map();
  lines.forEach(l=>{ const o=map.get(l.gst)||{rate:l.gst,taxable:0}; o.taxable+=l.taxable; map.set(l.gst,o); });
  let tax=0,cgst=0,sgst=0,ig=0;
  const groups=[...map.values()].sort((a,b)=>a.rate-b.rate).map(o=>{
    o.tax=Math.round(o.taxable*o.rate/100);
    if(igst){ o.igst=o.tax; o.cgst=0; o.sgst=0; } else { o.cgst=Math.round(o.tax/2); o.sgst=o.tax-o.cgst; o.igst=0; }
    tax+=o.tax; cgst+=o.cgst; sgst+=o.sgst; ig+=o.igst; return o;
  });
  const taxable=sumBy(lines,l=>l.taxable), gross=sumBy(lines,l=>l.gross), discount=sumBy(lines,l=>l.discAmt);
  const raw=taxable+tax;
  const ro=roundOff?Math.round(raw/100)*100-raw:0;
  return {lines,groups,gross,discount,taxable,tax,cgst,sgst,igst:ig,isIgst:!!igst,inclusive:!!inclusive,roundOff:ro,total:raw+ro};
}
function statusOf(d,t){ return d.void?'cancelled':d.balance<=0?'paid':(d.due&&d.due<t)?'overdue':d.paid>0?'partial':'unpaid'; }
const ST={paid:'Paid',partial:'Part paid',unpaid:'Unpaid',overdue:'Overdue',cancelled:'Cancelled'};
const pill=(s,lg)=>`<span class="st ${s}${lg?' lg':''}">${ST[s]}</span>`;

/* Payments settle linked bills first, then the oldest bills. */
function allocate(docs,pays,openingDue){
  const live=docs.slice().sort(byDate);
  const byId=new Map(live.map(d=>[d.id,d]));
  const queue=[];
  pays.slice().sort(byDate).forEach(p=>{
    let left=p.amount;
    const target=p.invoiceId&&byId.get(p.invoiceId);
    if(target&&target.balance>0){ const a=Math.min(left,target.balance); target.paid+=a; target.balance-=a; target.alloc.push({pay:p,amount:a}); left-=a; }
    if(left>0) queue.push({pay:p,left});
  });
  let oDue=openingDue;
  for(const q of queue){ if(oDue<=0) break; const a=Math.min(q.left,oDue); q.left-=a; oDue-=a; }
  let qi=0;
  for(const d of live){
    while(d.balance>0&&qi<queue.length){
      const q=queue[qi]; if(q.left<=0){ qi++; continue; }
      const a=Math.min(q.left,d.balance); q.left-=a; d.paid+=a; d.balance-=a; d.alloc.push({pay:q.pay,amount:a});
      if(q.left<=0) qi++;
    }
  }
  return oDue;
}

let _memo={ver:-1,t:'',val:null};
function books(){
  const t=todayStr();
  if(_memo.ver===Store.ver&&_memo.t===t&&_memo.val) return _memo.val;
  const S=Store.settings||{};
  const products=Store.data.products.map(p=>Object.assign({},p,{kind:p.kind==='service'?'service':'goods',name:String(p.name||'Unnamed item'),unit:p.unit||'',hsn:p.hsn||'',sale:Math.round(+p.sale||0),cost:Math.round(+p.cost||0),gst:Number(p.gst??0)||0,opening:Number(p.opening)||0,low:Number(p.low)||0,inQty:0,outQty:0,moves:[]}));
  const prodById=new Map(products.map(p=>[p.id,p]));
  const prodByName=new Map(); products.forEach(p=>{ if(!prodByName.has(key(p.name))) prodByName.set(key(p.name),p); });
  const findProd=it=>(it.pid&&prodById.get(it.pid))||prodByName.get(key(it.name))||null;

  const parties=Store.data.parties.map(p=>Object.assign({},p,{name:String(p.name||'Unnamed party'),type:['customer','supplier','both'].includes(p.type)?p.type:'customer',opening:Math.round(+p.opening||0),virtual:false}));
  const partyById=new Map(parties.map(p=>[p.id,p]));
  const partyByName=new Map(); parties.forEach(p=>{ if(!partyByName.has(key(p.name))) partyByName.set(key(p.name),p); });
  const findParty=(id,name)=>{
    let p=(id&&partyById.get(id))||partyByName.get(key(name));
    if(!p){ const nm=String(name||'').trim()||'Unknown party'; p={id:'n:'+key(nm),name:nm,type:'customer',opening:0,virtual:true}; parties.push(p); partyById.set(p.id,p); partyByName.set(key(nm),p); }
    return p;
  };
  const norm=(d,kind)=>{
    const items=(Array.isArray(d.items)?d.items:[]).map(it=>{
      const o={pid:it.pid||'',name:String(it.name??it.d??''),hsn:String(it.hsn||''),unit:String(it.unit||''),qty:Number(it.qty??it.q??0)||0,rate:Math.round(Number(it.rate??it.r??0))||0,disc:Number(it.disc||0)||0,gst:Number(it.gst??d.gst??0)||0};
      o.product=findProd(o); return o;
    });
    const party=findParty(d.partyId,d.party??d.customer??d.supplier);
    const calc=calcTotals(items,{inclusive:!!d.inclusive,igst:!!d.igst,roundOff:!!d.roundOff});
    return Object.assign({},d,{kind,items,party,partyName:party.name,no:String(d.no||''),date:d.date||'',due:d.due||d.date||'',void:!!d.void,calc,total:calc.total,paid:0,balance:calc.total,alloc:[]});
  };
  const sales=Store.data.invoices.map(d=>norm(d,'sale'));
  const purchases=Store.data.purchases.map(d=>norm(d,'purchase'));
  const payments=Store.data.payments.map(d=>{ const dir=d.dir==='out'?'out':'in'; const party=findParty(d.partyId,d.party??d.customer); return Object.assign({},d,{dir,party,partyName:party.name,amount:Math.round(+d.amount||0),mode:d.mode||'Cash',date:d.date||''}); });
  const expenses=Store.data.expenses.map(d=>Object.assign({},d,{amount:Math.round(+d.amount||0),category:d.category||'Other',mode:d.mode||'Cash',date:d.date||''}));

  parties.forEach(p=>Object.assign(p,{sales:[],purchases:[],payIn:[],payOut:[],salesTotal:0,purchTotal:0,received:0,paidOut:0,lastDate:''}));
  const seen=(p,dt)=>{ if(dt>p.lastDate) p.lastDate=dt; };
  sales.forEach(s=>{ s.party.sales.push(s); if(!s.void) s.party.salesTotal+=s.total; seen(s.party,s.date); });
  purchases.forEach(s=>{ s.party.purchases.push(s); if(!s.void) s.party.purchTotal+=s.total; seen(s.party,s.date); });
  payments.forEach(p=>{ if(p.dir==='in'){ p.party.payIn.push(p); p.party.received+=p.amount; } else { p.party.payOut.push(p); p.party.paidOut+=p.amount; } seen(p.party,p.date); });
  parties.forEach(p=>{
    p.balance=p.opening+p.salesTotal-p.received-p.purchTotal+p.paidOut;
    if(p.virtual){ const s=p.sales.length||p.payIn.length, b=p.purchases.length||p.payOut.length; p.type=s&&b?'both':b?'supplier':'customer'; }
    p.openRecvDue=allocate(p.sales.filter(x=>!x.void),p.payIn,Math.max(0,p.opening));
    p.openPayDue=allocate(p.purchases.filter(x=>!x.void),p.payOut,Math.max(0,-p.opening));
  });

  const move=(doc,dir)=>doc.items.forEach(it=>{ const p=it.product; if(!p||doc.void||p.kind==='service') return; if(dir>0) p.inQty+=it.qty; else p.outQty+=it.qty; p.moves.push({date:doc.date,createdAt:doc.createdAt,doc,qty:it.qty*dir,rate:it.rate}); });
  sales.forEach(d=>move(d,-1)); purchases.forEach(d=>move(d,1));
  products.forEach(p=>{
    p.moves.sort(byDate);
    p.stock=p.kind==='service'?null:p.opening+p.inQty-p.outQty;
    p.value=p.kind==='service'?0:Math.round(Math.max(0,p.stock)*p.cost);
    p.isLow=p.kind!=='service'&&p.low>0&&p.stock<=p.low;
  });

  let cash=Math.round(+S.openingCash||0), bank=Math.round(+S.openingBank||0);
  payments.forEach(p=>{ const v=p.dir==='in'?p.amount:-p.amount; if(isCash(p.mode)) cash+=v; else bank+=v; });
  expenses.forEach(e=>{ if(isCash(e.mode)) cash-=e.amount; else bank-=e.amount; });

  const val={t,S,products,prodById,prodByName,findProd,parties,partyById,sales,purchases,payments,expenses,cash,bank,
    receivable:sumBy(parties,p=>Math.max(0,p.balance)),payable:sumBy(parties,p=>Math.max(0,-p.balance))};
  _memo={ver:Store.ver,t,val};
  return val;
}

function periodStats(B,r){
  const s=B.sales.filter(x=>!x.void&&inR(x.date,r)), pu=B.purchases.filter(x=>!x.void&&inR(x.date,r)), ex=B.expenses.filter(x=>inR(x.date,r));
  let cogs=0, uncosted=0;
  s.forEach(x=>x.calc.lines.forEach(l=>{ const p=l.product; if(p&&p.kind==='service') return; if(p&&p.cost>0) cogs+=Math.round(l.qty*p.cost); else uncosted++; }));
  const salesTaxable=sumBy(s,x=>x.calc.taxable), expTotal=sumBy(ex,x=>x.amount);
  return {s,pu,ex,salesTaxable,salesTotal:sumBy(s,x=>x.total),purchTaxable:sumBy(pu,x=>x.calc.taxable),purchTotal:sumBy(pu,x=>x.total),cogs,uncosted,expTotal,gross:salesTaxable-cogs,net:salesTaxable-cogs-expTotal,
    recv:sumBy(B.payments.filter(p=>p.dir==='in'&&inR(p.date,r)),p=>p.amount),paid:sumBy(B.payments.filter(p=>p.dir==='out'&&inR(p.date,r)),p=>p.amount)};
}
function nextInvoiceNo(B){
  const S=B.S, prefix=S.prefix||'INV-';
  let max=0;
  B.sales.forEach(s=>{ if(s.no.startsWith(prefix)){ const n=parseInt(s.no.slice(prefix.length).replace(/\D/g,''),10); if(n>max) max=n; } });
  const next=Math.max(max+1,Math.floor(+S.startNo||1));
  return prefix+String(next).padStart(4,'0');
}
function entries(B){
  const E=[];

function range(){
  const d=new Date(), y=d.getFullYear(), m=d.getMonth(), fy=m>=3?y:y-1;
  switch(state.period){
    case 'lastmonth': return {from:ymd(y,m-1,1),to:ymd(y,m,0)};

    case 'fy': return {from:ymd(fy,3,1),to:ymd(fy+1,2,31)};

    case 'custom': { const f=state.from||ymd(y,m,1), t=state.to||todayStr(); return f<=t?{from:f,to:t}:{from:t,to:f}; }

/* The same stretch of the previous period, so a half-finished month is compared fairly. */
function comparison(){
  if(state.period==='all') return null;
  const r=range(), t=todayStr(), running=['month','quarter','fy'].includes(state.period);
  const end=running&&t<r.to?t:r.to;
  if(end<r.from) return null;
  const len=daysBetween(r.from,end), y=+r.from.slice(0,4), m=+r.from.slice(5,7)-1;
  let pf;
  switch(state.period){
    case 'month': case 'lastmonth': pf=ymd(y,m-1,1); break;
    case 'quarter': pf=ymd(y,m-3,1); break;
    case 'fy': case 'lastfy': pf=ymd(y-1,m,1); break;
    default: pf=addDays(r.from,-(len+1));
  }
  let pt=addDays(pf,len); const prevEnd=addDays(r.from,-1); if(pt>prevEnd) pt=prevEnd;
  const label={month:'vs same days last month',lastmonth:'vs the month before',quarter:'vs same days last quarter',fy:'vs same days last year',lastfy:'vs the year before',custom:`vs the ${len+1} days before`}[state.period];
  return {cur:{from:r.from,to:end},prev:{from:pf,to:pt},label};
}

function drawCharts(){ $$('.chartwrap[data-chart]').forEach(el=>{ const d=_charts[el.dataset.chart]; if(d) drawLine(el,d); }); }
function drawLine(el,d){
  const W=Math.max(280,Math.round(el.clientWidth||600)), H=250, L=58, R=14, T=16, BM=30;
  const cw=W-L-R, ch=H-T-BM, n=d.x.length;
  const top=niceMax(Math.max(100,...d.series.flatMap(s=>s.v)));
  const X=i=>L+(n<2?cw/2:i*cw/(n-1)), Y=v=>T+ch-ch*Math.max(0,v)/top;
  let g='';
  for(let i=0;i<=4;i++){ const y=(T+ch-ch*i/4).toFixed(1); g+=`<line class="${i?'gl':'base'}" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="yl" x="${L-10}" y="${(+y+4).toFixed(1)}">${moneyShort(top*i/4)}</text>`; }
  const every=W<560&&n>7?2:1;
  d.x.forEach((lab,i)=>{ if((n-1-i)%every) return; g+=`<text class="xl" x="${X(i).toFixed(1)}" y="${H-8}">${esc(lab)}</text>`; });
  d.series.forEach(s=>{
    const line='M'+s.v.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('L');
    if(s.area) g+=`<path class="area" style="fill:${s.color}" d="${line}L${X(n-1).toFixed(1)},${Y(0).toFixed(1)}L${X(0).toFixed(1)},${Y(0).toFixed(1)}Z"/>`;
    g+=`<path class="ln" style="stroke:${s.color}" d="${line}"/>`;
  });
  d.series.forEach(s=>{ g+=`<circle class="dot" style="fill:${s.color}" cx="${X(n-1).toFixed(1)}" cy="${Y(s.v[n-1]).toFixed(1)}" r="4"/>`; });
  g+=`<g class="hov" style="display:none"><line class="guide" x1="0" x2="0" y1="${T}" y2="${T+ch}"/>${d.series.map(s=>`<circle class="dot" style="fill:${s.color}" r="4.5" cx="0" cy="0"/>`).join('')}</g>`;
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg><div class="ctip" hidden></div>`;
  const svgEl=el.querySelector('svg'), hov=svgEl.querySelector('.hov'), tip=el.querySelector('.ctip'), guide=hov.querySelector('.guide'), dots=hov.querySelectorAll('circle');
  let cur=-1;
  const show=i=>{
    cur=i; const x=X(i);
    hov.style.display=''; guide.setAttribute('x1',x); guide.setAttribute('x2',x);
    dots.forEach((c,si)=>{ c.setAttribute('cx',x); c.setAttribute('cy',Y(d.series[si].v[i])); });
    tip.replaceChildren();
    const hd=document.createElement('b'); hd.textContent=d.full[i]; tip.appendChild(hd);
    d.series.forEach(s=>{ const row=document.createElement('div'); row.className='tr'; const k=document.createElement('i'); k.style.background=s.color; const v=document.createElement('strong'); v.textContent=money(s.v[i]); const nm=document.createElement('span'); nm.textContent=s.name; row.append(k,v,nm); tip.appendChild(row); });
    if(d.net&&d.series.length===2){ const row=document.createElement('div'); row.className='tr'; const v=document.createElement('strong'); v.textContent=money(d.series[0].v[i]-d.series[1].v[i]); const nm=document.createElement('span'); nm.textContent='Difference'; row.append(v,nm); tip.appendChild(row); }
    tip.hidden=false;
    const scale=el.clientWidth/W, tw=tip.offsetWidth; let left=x*scale; left=Math.min(Math.max(left,tw/2+2),el.clientWidth-tw/2-2); tip.style.left=left+'px';
  };
  const hide=()=>{ cur=-1; hov.style.display='none'; tip.hidden=true; };
  const idxAt=cx=>{ const rc=svgEl.getBoundingClientRect(); const x=(cx-rc.left)*(W/rc.width); return Math.max(0,Math.min(n-1,Math.round((x-L)/(n<2?1:cw/(n-1))))); };
  el.onpointermove=e=>show(idxAt(e.clientX));
  el.onpointerdown=e=>show(idxAt(e.clientX));

  el.onfocus=()=>show(cur>=0?cur:n-1);
  el.onblur=hide;
  el.onkeydown=e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight'){ e.preventDefault(); show(Math.max(0,Math.min(n-1,(cur>=0?cur:n-1)+(e.key==='ArrowLeft'?-1:1)))); } else if(e.key==='Escape') hide(); };
}
function sparkHTML(B,r){

function localDay(ms){ const t=new Date(ms); return ymd(t.getFullYear(),t.getMonth(),t.getDate()); }
function billHistory(d,B){
  const isS=d.kind==='sale', ev=[];
  ev.push({date:d.date,at:d.createdAt||0,t:isS?'Bill created':'Bill recorded',s:`${fmtDate(d.date)}, ${money(d.total)}`,c:''});
  d.alloc.forEach(a=>ev.push({date:a.pay.date,at:a.pay.createdAt||0,t:`${isS?'Received':'Paid'} ${money(a.amount)}`,s:`${fmtDate(a.pay.date)}, ${esc(a.pay.mode)}${a.pay.ref?', '+esc(a.pay.ref):''}`,c:'g',open:'pay:'+a.pay.id}));
  if(!d.void&&statusOf(d,B.t)==='overdue') ev.push({date:d.due,at:0,t:'Became overdue',s:`Was due on ${fmtDate(d.due)}`,c:'r'});
  if(d.editedAt) ev.push({date:localDay(d.editedAt),at:d.editedAt,t:'Edited',s:new Date(d.editedAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}),c:'m'});

  ev.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.at-b.at);
  return `<section class="card"><div class="card-h"><h2>History</h2></div><div class="card-b"><ul class="timeline">${ev.map(e=>`<li${e.open?` data-open="${esc(e.open)}" tabindex="0"`:''}><i class="${e.c}"></i><b>${e.t}</b><span>${e.s}</span></li>`).join('')}</ul></div></section>`;

function txnDetail(B,kind){
  const isS=kind==='sale', d=(isS?B.sales:B.purchases).find(x=>x.id===state.id), back=[isS?'sales':'purchases',isS?'Sales':'Purchases'];
  if(!d) return pageHead('Bill not found',{back})+`<div class="card">${emptyHTML('receipt','This bill isn’t in your books anymore','It may have been deleted on another device.')}</div>`;
  const st=statusOf(d,B.t), c=d.calc, ids=`data-kind="${kind}" data-id="${esc(d.id)}"`;
  const actions=d.void
    ?`<button class="btn primary" data-act="restore" ${ids}>${ICON.refresh}Restore bill</button><button class="btn" data-act="dup" ${ids}>${ICON.copy}Duplicate</button>`
    :`<button class="btn primary" data-act="pdf-bill" ${ids}>${ICON.download}Download PDF</button>${isS?`<button class="btn" data-act="share-bill" ${ids}>${ICON.whatsapp}Share</button>`:''}<button class="btn hide-m" data-act="edit-bill" ${ids}>${ICON.edit}Edit</button><button class="btn icon-only" data-act="menu" data-menu="bill" ${ids} aria-label="More actions" aria-haspopup="menu">${ICON.more}</button>`;
  const tax=`<section class="card"><div class="card-h"><h2>Tax</h2></div><div class="card-b"><dl class="kv flat"><dt>Supply</dt><dd>${c.isIgst?'Inter-state':'Within state'}</dd><dt>Rates</dt><dd>${c.inclusive?'Include GST':'Exclude GST'}</dd><dt>Taxable value</dt><dd>${money(c.taxable)}</dd>${c.isIgst?`<dt>IGST</dt><dd>${money(c.igst)}</dd>`:`<dt>CGST</dt><dd>${money(c.cgst)}</dd><dt>SGST</dt><dd>${money(c.sgst)}</dd>`}<dt>Total tax</dt><dd>${money(c.tax)}</dd></dl></div></section>`;
  return pageHead(`${esc(d.no||'Bill')} ${pill(st,true)}`,{back,sub:`${isS?'Sale to':'Purchase from'} ${esc(d.partyName)}, ${fmtDate(d.date)}`,actions})
    +`<div class="detail"><div class="d-main">${invoiceHTML(d,B)}</div><div class="d-top">${billSummary(d,B)}</div><div class="d-bottom">${billHistory(d,B)}${tax}</div></div>`;

VIEWS.item=B=>{
  const p=B.products.find(x=>x.id===state.id), back=['items','Items'];
  if(!p) return pageHead('Item not found',{back})+`<div class="card">${emptyHTML('box','This item isn’t in your books anymore','It may have been deleted on another device.')}</div>`;
  const r=range(), svc=p.kind==='service';
  let soldQ=0, soldV=0; const sold=[];
  B.sales.forEach(s=>{ if(s.void||!inR(s.date,r)) return; s.calc.lines.forEach(l=>{ if(l.product===p){ soldQ+=l.qty; soldV+=l.taxable; sold.push({s,l}); } }); });
  const margin=p.sale>0&&p.cost>0?((p.sale-p.cost)*100/p.sale).toFixed(1)+'%':'Not set';
  const meta=[p.hsn?`<span>${ICON.tag}HSN/SAC ${esc(p.hsn)}</span>`:'',p.sku?`<span>${ICON.id}Code ${esc(p.sku)}</span>`:'',`<span>${ICON.percent}GST ${p.gst}%</span>`,p.unit?`<span>${ICON.layers}Unit ${esc(p.unit)}</span>`:''].join('');
  const head=`<section class="card profile">${ibadge(svc?'tag':'box',svc?'violet':'brand','xl')}<div class="pm"><h1>${esc(p.name)}<span class="st ${svc?'svc':'neutral'}">${svc?'Service':'Goods'}</span>${p.isLow?'<span class="st low">Low stock</span>':''}</h1><div class="meta">${meta}</div></div><div class="pa"><button class="btn primary" data-act="new-sale" data-pid="${esc(p.id)}">${ICON.plus}Sell</button>${svc?'':`<button class="btn" data-act="new-purchase" data-pid="${esc(p.id)}">${ICON.cart}Buy stock</button>`}<button class="btn icon-only" data-act="menu" data-menu="item" data-id="${esc(p.id)}" aria-label="More actions" aria-haspopup="menu">${ICON.more}</button></div></section>`;
  let top;
  if(svc) top=`<section class="card sumcard"><div class="sum-h"><span class="lab">Sale price</span></div><div class="big">${bigMoney(p.sale)}</div><p class="help">Services don’t carry stock.</p></section>`;
  else { const cap=Math.max(p.low*3,p.stock,1), pct=Math.max(0,p.stock)*100/cap, cls=p.stock<=0||p.isLow?'bad':p.low&&p.stock<=p.low*1.5?'warn':'';
    top=`<section class="card sumcard"><div class="sum-h"><span class="lab">In stock</span>${p.isLow?'<span class="st low">Low stock</span>':''}</div><div class="big ${p.isLow?'neg':''}">${qty(p.stock)}<span class="unit">${esc(p.unit)}</span></div><div class="meter ${cls}"><i style="width:${Math.max(p.stock>0?3:0,pct).toFixed(1)}%"></i></div><div class="sum-f"><span>${p.low?`Alert at ${qty(p.low)} ${esc(p.unit)}`:'No alert level set'}</span><span>Worth ${money(p.value)}</span></div></section>`; }
  const prices=`<section class="card"><div class="card-h"><h2>Prices</h2><button class="link" data-act="edit-item" data-id="${esc(p.id)}">Edit</button></div><div class="card-b"><dl class="kv flat"><dt>Sale price</dt><dd>${money(p.sale)}</dd><dt>Purchase price</dt><dd>${p.cost?money(p.cost):'Not set'}</dd><dt>Margin</dt><dd>${margin}</dd><dt>GST</dt><dd>${p.gst}%</dd><dt>Sold ${periodPhrase()}</dt><dd>${qty(soldQ)} ${esc(p.unit)}<small class="mut">${money(soldV)} before GST</small></dd></dl></div></section>`;
  let main;
  if(svc){
    const rows=sold.sort((a,b)=>byDate(b.s,a.s)).map(({s,l})=>`<tr data-go="sale:${esc(s.id)}" tabindex="0"><td>${esc(s.no)}, ${esc(s.partyName)}<small>${fmtDate(s.date)}</small></td><td class="n">${qty(l.qty)}</td><td class="n">${money(l.taxable)}</td></tr>`).join('');
    main=`<section class="card tcard"><div class="card-h"><div><h2>Sales of this service</h2><p class="muted">${periodText(r)}</p></div>${periodSelect()}</div><div class="twrap"><table class="t"><thead><tr><th>Bill</th><th class="n">Qty</th><th class="n">Before GST</th></tr></thead><tbody>${rows||'<tr><td colspan="3"><div class="empty sm"><p>No sales in this period.</p></div></td></tr>'}</tbody></table></div></section>`;
  } else {
    let open=p.opening; p.moves.forEach(m=>{ if(m.date<r.from) open+=m.qty; });
    let bal=open;
    const rows=p.moves.filter(m=>inR(m.date,r)).map(m=>{ bal+=m.qty; return `<tr data-go="${m.doc.kind==='sale'?'sale':'purchase'}:${esc(m.doc.id)}" tabindex="0"><td>${m.doc.kind==='sale'?'Sale':'Purchase'} ${esc(m.doc.no)}<small>${esc(m.doc.partyName)}, ${fmtDate(m.date)}</small></td><td class="n pos">${m.qty>0?'+'+qty(m.qty):''}</td><td class="n neg">${m.qty<0?'−'+qty(-m.qty):''}</td><td class="n">${qty(bal)}</td></tr>`; }).join('');
    main=`<section class="card tcard"><div class="card-h"><div><h2>Stock movement</h2><p class="muted">${periodText(r)}</p></div>${periodSelect()}</div><div class="twrap"><table class="t"><thead><tr><th>Particulars</th><th class="n">In</th><th class="n">Out</th><th class="n">Balance</th></tr></thead><tbody><tr class="open"><td>Opening stock<small>${state.period==='all'?'Start of your books':fmtDate(r.from)}</small></td><td></td><td></td><td class="n">${qty(open)}</td></tr>${rows}</tbody><tfoot><tr><td>Closing stock</td><td></td><td></td><td class="n">${qty(bal)} ${esc(p.unit)}</td></tr></tfoot></table></div></section>`;
  }
  return crumb(...back)+head+`<div class="detail"><div class="d-main">${main}</div><div class="d-top">${top}</div><div class="d-bottom">${prices}</div></div>`;
};

function gstGroups(docs,r){
  const g=new Map();
  docs.filter(d=>!d.void&&inR(d.date,r)).forEach(d=>d.calc.groups.forEach(x=>{ const o=g.get(x.rate)||{rate:x.rate,taxable:0,cgst:0,sgst:0,igst:0}; o.taxable+=x.taxable; o.cgst+=x.cgst; o.sgst+=x.sgst; o.igst+=x.igst; g.set(x.rate,o); }));
  return [...g.values()].sort((a,b)=>a.rate-b.rate);

function fmtCell(v,t,mode){
  if(v==null||v==='') return '';
  const csv=mode==='csv', pdf=mode==='pdf';
  switch(t){
    case 'money': return csv?(v/100).toFixed(2):pdf?plain(v):money(v);
    case 'qty': return csv?String(v):qty(v);
    case 'date': return csv?v:fmtDate(v);
    case 'pct': return csv?Number(v).toFixed(1):Number(v).toFixed(1)+'%';
    case 'drcr': return csv?(v/100).toFixed(2):v===0?'Nil':(pdf?plain(Math.abs(v)):money(Math.abs(v)))+(v>0?' Dr':' Cr');
    default: return csv||pdf?String(v):esc(v);
  }
}
const numCol=t=>['money','qty','pct','drcr'].includes(t);
function reportTable(res){
  const cols=res.cols, n=cols.length, cl=i=>numCol(cols[i].t)?'n':'';
  const body=res.rows.map(r=>r.sec?`<tr class="sec"><td colspan="${n}">${esc(r.sec)}</td></tr>`:`<tr class="${r.cls||''}"${r.go?` data-go="${esc(r.go)}" tabindex="0"`:''}${r.open?` data-open="${esc(r.open)}" tabindex="0"`:''}>${r.c.map((v,i)=>`<td class="${cl(i)}">${fmtCell(v,cols[i].t)}</td>`).join('')}</tr>`).join('');
  return `<div class="twrap"><table class="t${res.wide?' wide':''}"><thead><tr>${cols.map((c,i)=>`<th class="${cl(i)}">${c.h}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${n}"><div class="empty sm"><p>No entries for this period.</p></div></td></tr>`}</tbody>${res.foot?`<tfoot><tr>${res.foot.map((v,i)=>`<td class="${cl(i)}">${fmtCell(v,cols[i].t)}</td>`).join('')}</tr></tfoot>`:''}</table></div>`;
}
function toCSV(res,title,sub){
  const q=v=>{ const s=String(v??''); return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const out=[q(title),q(sub),'',res.cols.map(c=>q(c.h)).join(',')];
  res.rows.forEach(r=>out.push(r.sec?q(r.sec):r.c.map((v,i)=>q(fmtCell(v,res.cols[i].t,'csv'))).join(',')));
  if(res.foot) out.push(res.foot.map((v,i)=>q(fmtCell(v,res.cols[i].t,'csv'))).join(','));
  return '\uFEFF'+out.join('\r\n');
}

async function saveSettingsForm(form){
  const g=id=>form.querySelector('#'+id), err=g('s-err'), v=id=>g(id).value.trim();
  const fail=m=>{ err.textContent=m; err.scrollIntoView({block:'nearest'}); };
  err.textContent='';
  const gstin=v('s-gstin').toUpperCase();
  if(gstin&&!GSTIN_RE.test(gstin)) return fail('That GSTIN doesn’t look right. It has 15 characters, like 27ABCDE1234F1Z5.');
  const ocash=toPaise(v('s-ocash')), obank=toPaise(v('s-obank'));
  if(!Number.isFinite(ocash)||!Number.isFinite(obank)) return fail('Opening balances must be numbers.');
  const start=v('s-start')?parseInt(v('s-start'),10):0;
  if(v('s-start')&&(!Number.isFinite(start)||start<1)) return fail('Start numbering from a whole number, 1 or more.');
  const S=Object.assign({},Store.settings,{name:v('s-name'),phone:v('s-phone'),email:v('s-email'),address:g('s-address').value.trim(),state:g('s-state').value,gstin,
    prefix:g('s-prefix').value,startNo:start||null,terms:+g('s-terms').value,gst:+g('s-gst').value,inclusive:g('s-incl').checked,roundOff:g('s-round').checked,termsText:g('s-termsText').value.trim(),
    bank:v('s-bank'),upi:v('s-upi'),acct:v('s-acct'),ifsc:v('s-ifsc').toUpperCase(),openingCash:ocash,openingBank:obank,sampleProfile:false});
  if(gstin&&!S.state) S.state=gstin.slice(0,2);
  const btn=form.querySelector('[type=submit]'); btn.disabled=true;
  try{ await Store.saveSettings(S); form.dataset.dirty=''; toast('Settings saved'); applyChrome(); render(true); }
  catch(e){ fail('Settings weren’t saved. Check your connection and try again.'); }
  finally{ btn.disabled=false; }
}

function totalsBox(c,isS,recv){

  h+=T('Taxable value',money(c.taxable));
  c.groups.filter(g=>g.rate>0).forEach(g=>{ h+=c.isIgst?T(`IGST ${g.rate}%`,money(g.igst),'mut'):T(`CGST ${g.rate/2}%`,money(g.cgst),'mut')+T(`SGST ${g.rate/2}%`,money(g.sgst),'mut'); });

    else if(act==='full-recv'){ const c=upd(); g('t-recv').value=(c.total/100).toFixed(2); dirty=true; upd(); }
  });
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const err=g('t-err'); err.textContent='';
    const fail=m=>{ err.textContent=m; err.scrollIntoView({block:'nearest'}); };
    const pname=g('t-party').value.trim();
    if(!pname) return fail(`Add the ${who.toLowerCase()}’s name.`);
    let no=g('t-no').value.trim();
    if(isS&&!no) return fail('Add an invoice number.');
    if(isS){ const clash=B.sales.find(x=>key(x.no)===key(no)&&(!editing||x.id!==src.id)); if(clash) return fail(`Invoice number ${no} is already used. Pick another number.`); }
    if(!isS&&!no) no='PUR-'+String(B.purchases.length+1).padStart(4,'0');
    const date=g('t-date').value; if(!date) return fail('Pick the bill date.');
    const due=g('t-due').value||date; if(due<date) return fail('The due date can’t be before the bill date.');
    const rows=readLines().filter(used);
    if(!rows.length) return fail('Add at least one item.');
    for(const r of rows){
      if(!r.name) return fail('Every line needs an item name.');
      if(!Number.isFinite(r.qty)||r.qty<=0) return fail(`Check the quantity for “${r.name}”.`);
      if(!Number.isFinite(r.rate)||r.rate<0) return fail(`Check the rate for “${r.name}”.`);
      if(!Number.isFinite(r.disc)||r.disc<0||r.disc>100) return fail(`The discount for “${r.name}” must be between 0 and 100%.`);
    }
    const existing=B.parties.find(p=>!p.virtual&&key(p.name)===key(pname));
    const np={phone:g('t-pphone').value.trim(),gstin:g('t-pgstin').value.trim().toUpperCase(),state:g('t-pstate').value};
    if(!existing&&np.gstin&&!GSTIN_RE.test(np.gstin)) return fail('That GSTIN doesn’t look right. It has 15 characters, like 27ABCDE1234F1Z5.');
    const opts={inclusive:g('t-incl').checked,igst:igstNow(),roundOff:g('t-round').checked};
    const c=calcTotals(rows,opts);
    let recv=0, mode='Cash';
    if(!editing){ recv=toPaise(g('t-recv').value); mode=g('t-mode').value; if(!Number.isFinite(recv)||recv<0) return fail(`Check the amount ${isS?'received':'paid'}.`); if(recv>c.total) return fail(`The amount ${isS?'received':'paid'} can’t be more than the bill total.`); }
    const btn=f.querySelector('[type=submit]'); btn.disabled=true;
    try{
      const partyId=existing?existing.id:await Store.add('parties',{name:pname,type:isS?'customer':'supplier',phone:np.phone,email:'',gstin:np.gstin,state:np.state||(np.gstin?np.gstin.slice(0,2):''),address:'',opening:0});
      const items=[], made=new Map();
      for(const r of rows){
        let pid=r.pid&&B.prodById.get(r.pid)?r.pid:'';
        if(!pid){ const p=B.prodByName.get(key(r.name)); if(p) pid=p.id; }
        if(!pid&&g('t-saveitems').checked){ const k=key(r.name); pid=made.get(k)||''; if(!pid){ pid=await Store.add('products',{name:r.name,kind:'goods',unit:r.unit||'pcs',hsn:r.hsn,sku:'',sale:isS?r.rate:0,cost:isS?0:r.rate,gst:r.gst,opening:0,low:0}); made.set(k,pid); } }
        items.push({pid,name:r.name,hsn:r.hsn,unit:r.unit,qty:r.qty,rate:r.rate,disc:r.disc||0,gst:r.gst});
      }
      const doc={v:2,no,date,due,terms:+g('t-terms').value||0,partyId,party:pname,pos:g('t-pos').value,igst:opts.igst,inclusive:opts.inclusive,roundOff:opts.roundOff,items,notes:g('t-notes').value.trim(),total:c.total,void:false,createdAt:editing?(src.createdAt||Date.now()):Date.now()};
      const coll=isS?'invoices':'purchases';
      let id;
      if(editing){ doc.editedAt=Date.now(); if(src.demo) doc.demo=true; id=await Store.put(coll,src.id,doc); }
      else id=await Store.add(coll,doc);
      if(!editing&&recv>0) await Store.add('payments',{dir:isS?'in':'out',partyId,party:pname,amount:recv,date,mode,ref:no,invoiceId:id,note:(isS?'Received with ':'Paid with ')+no});
      closeLayer(L); toast(editing?'Changes saved':isS?`Sale ${no} saved`:'Purchase saved');
      state.view=kind; state.id=id; render(true); window.scrollTo(0,0);
    }catch(ex){ console.error(ex); btn.disabled=false; fail(saveErr(ex)); }
  });
  partyCheck(); setTimeout(upd,0);
}

async function runPool(tasks,n,onStep){
  let i=0, done=0, fatal=null;
  const worker=async()=>{ while(i<tasks.length&&!fatal){ const k=i++; try{ await tasks[k](); }catch(e){ if(e&&['quota_exceeded','revoked','invalid_argument'].includes(e.code)) fatal=e; else { await new Promise(r=>setTimeout(r,500+Math.random()*500)); try{ await tasks[k](); }catch(e2){ fatal=e2; } } } done++; if(onStep) onStep(done,tasks.length); } };
  await Promise.all(Array.from({length:Math.min(n,tasks.length)},worker));
  if(fatal) throw fatal;
}

    if(!p.virtual) items.push([`data-act="del-party" data-id="${id}"`,'trash','Delete party',true]);
  } else if(k==='item'){
    items=[[`data-act="edit-item" data-id="${id}"`,'edit','Edit item'],[`data-act="del-item" data-id="${id}"`,'trash','Delete item',true]];
  }
  if(!items.length) return;
  if(window.matchMedia('(max-width:640px)').matches){
    openLayer(`<div class="ptop"><h2>More actions</h2><button type="button" class="xbtn" data-close aria-label="Close">×</button></div><ul class="menu">${items.map(([a,i,l,dg])=>`<li><button ${a} data-closefirst class="${dg?'danger':''}">${ICON[i]}<span>${l}</span></button></li>`).join('')}</ul>`,{size:'menu-p',label:'More actions'});
    return;
  }
  const m=document.createElement('div'); m.className='pop'; m.setAttribute('role','menu');
  m.innerHTML=items.map(([a,i,l,dg])=>`<button role="menuitem" ${a} class="${dg?'danger':''}">${ICON[i]}<span>${l}</span></button>`).join('');
  document.body.appendChild(m);
  const r=btn.getBoundingClientRect(), mw=m.offsetWidth, mh=m.offsetHeight;
  let top=r.bottom+6; if(top+mh>window.innerHeight-8) top=Math.max(8,r.top-mh-6);
  m.style.left=Math.min(window.innerWidth-mw-8,Math.max(8,r.right-mw))+'px'; m.style.top=top+'px';
  _menu=m; _menuBtn=btn; btn.setAttribute('aria-expanded','true');
  const f=m.querySelector('button'); if(f) f.focus();
}
window.addEventListener('scroll',()=>{ if(_menu) closeMenu(); },{passive:true});
function waNumber(ph){ let d=String(ph||'').replace(/\D/g,''); if(d.length===11&&d[0]==='0') d=d.slice(1); if(d.length===10) d='91'+d; return d.length>=11&&d.length<=15?d:''; }
function payLines(S){ const out=[]; if(S.upi) out.push(`UPI: ${S.upi}`); if(S.acct) out.push(`Bank: ${[S.bank,'A/c '+S.acct,S.ifsc?'IFSC '+S.ifsc:''].filter(Boolean).join(', ')}`); return out; }
function reminderText(p,bill,B){
  const S=B.S, biz=S.name||'us', L=[`Namaste ${p.name},`,''];
  if(bill){
    L.push(`This is a friendly reminder from ${biz} about bill ${bill.no} dated ${fmtDate(bill.date)}.`);
    L.push(`Balance due: ${money(bill.balance)}${bill.due<B.t?`, which was due on ${fmtDate(bill.due)}`:`, due on ${fmtDate(bill.due)}`}.`);
  } else {
    const open=p.sales.filter(s=>!s.void&&s.balance>0).sort(byDate);
    L.push(`This is a friendly reminder from ${biz}. The balance on your account is ${money(p.balance)}.`);
    if(open.length){ L.push('','Pending bills:'); open.slice(0,6).forEach(s=>L.push(`${s.no}, ${fmtDate(s.date)}: ${money(s.balance)}`)); if(open.length>6) L.push(`and ${plural(open.length-6,'more bill')}`); }
  }
  const pay=payLines(S); if(pay.length) L.push('',...pay);
  L.push('','Please ignore this message if you have already paid. Thank you.');
  return L.join('\n');
}
function shareBillText(d,B){
  const S=B.S, L=[`Hello ${d.partyName},`,'',`Here are the details of bill ${d.no} from ${S.name||'us'}:`,`Date: ${fmtDate(d.date)}`,`Amount: ${money(d.total)}`];
  L.push(d.balance>0?`Balance due: ${money(d.balance)} by ${fmtDate(d.due)}`:'Status: Paid in full');
  const pay=payLines(S); if(d.balance>0&&pay.length) L.push('',...pay);
  L.push('','Thank you for your business.');
  return L.join('\n');
}
function openMessage(title,text,phone,hint){
  const num=waNumber(phone);
  const L=openLayer(`<div class="ptop"><h2>${esc(title)}</h2><button type="button" class="xbtn" data-close aria-label="Close">×</button></div>
   <label class="f"><span>Message</span><textarea id="wa-msg" class="msgbox" rows="10">${esc(text)}</textarea></label>
   <p class="help">${hint?hint+' ':''}${num?`WhatsApp opens a chat with +${num.slice(0,-10)} ${num.slice(-10)}.`:'No mobile number is saved for this party, so WhatsApp asks you to pick a chat.'} Check the message there before you send it.</p>
   <div class="pfoot even"><button type="button" class="btn" id="wa-copy">${ICON.copy}Copy</button><a class="btn wa" id="wa-go" target="_blank" rel="noopener noreferrer" href="https://wa.me/">${ICON.whatsapp}Open WhatsApp</a></div>`,{label:title});
  const ta=L.querySelector('#wa-msg'), a=L.querySelector('#wa-go');
  const upd=()=>{ a.href=`https://wa.me/${num}?text=${encodeURIComponent(ta.value)}`; };
  ta.addEventListener('input',upd); upd();
  L.querySelector('#wa-copy').addEventListener('click',()=>{
    const fallback=()=>{ ta.focus(); ta.select(); toast('Message selected. Copy it from here.'); };
    try{ navigator.clipboard.writeText(ta.value).then(()=>toast('Message copied'),fallback); }catch(e){ fallback(); }
  });
}
function openRemind(el){
  const B=books(); let p=null, bill=null;
  if(el.dataset.kind==='sale'&&el.dataset.id){ bill=B.sales.find(x=>x.id===el.dataset.id); if(bill) p=bill.party; }
  else if(el.dataset.party) p=B.parties.find(x=>x.id===el.dataset.party);
  if(!p){ toast('That record isn’t in your books anymore.'); return; }
  openMessage('Payment reminder',reminderText(p,bill,B),p.phone,'');
}
function openShareBill(el){
  const B=books(), d=B.sales.find(x=>x.id===el.dataset.id); if(!d) return;
  openMessage(`Share ${d.no}`,shareBillText(d,B),d.party.phone,'To send the bill itself, download the PDF and attach it in WhatsApp.');
}

/* =========================================================
   Events
   ========================================================= */
const ACTS={
  quick:()=>openQuick(),
  'new-sale':el=>openTxnForm('sale',{partyId:el.dataset.party,pid:el.dataset.pid}),
  'new-purchase':el=>openTxnForm('purchase',{partyId:el.dataset.party,pid:el.dataset.pid}),
  'edit-bill':el=>openTxnForm(el.dataset.kind,{id:el.dataset.id}),
  dup:el=>openTxnForm(el.dataset.kind,{dup:el.dataset.id}),
  void:el=>voidBill(el.dataset.kind,el.dataset.id,true),
  restore:el=>voidBill(el.dataset.kind,el.dataset.id,false),
  'pdf-bill':el=>pdfBill(el.dataset.kind,el.dataset.id),
  'pay-bill':el=>{ const B=books(), d=(el.dataset.kind==='sale'?B.sales:B.purchases).find(x=>x.id===el.dataset.id); if(d) openPayForm({dir:el.dataset.kind==='sale'?'in':'out',partyId:d.party.id,invoiceId:d.id,amount:d.balance}); },
  'pay-in':el=>openPayForm({dir:'in',partyId:el.dataset.party}),
  'pay-out':el=>openPayForm({dir:'out',partyId:el.dataset.party}),
  'pay-edit':el=>openPayForm({id:el.dataset.id}),
  'pay-del':el=>delDoc('payments',el.dataset.id,'Delete this payment?','The bills it settled will show as due again.',()=>closeLayer()),
  'pay-receipt':el=>pdfReceipt(el.dataset.id),
  'new-exp':()=>openExpForm({}),
  'exp-edit':el=>openExpForm({id:el.dataset.id}),
  'exp-del':el=>delDoc('expenses',el.dataset.id,'Delete this expense?','It will be removed from your expenses and cash book.',()=>closeLayer()),
  'new-party':()=>openPartyForm({}),
  'edit-party':el=>openPartyForm({id:el.dataset.id}),
  'del-party':el=>delDoc('parties',el.dataset.id,'Delete this party?','Their details are removed. Bills and payments stay in your books under their name.',()=>go('parties')),
  'pdf-statement':el=>pdfStatement(el.dataset.id),
  'new-item':()=>openItemForm({}),
  'edit-item':el=>openItemForm({id:el.dataset.id}),
  'del-item':el=>delDoc('products',el.dataset.id,'Delete this item?','It is removed from your item list. Past bills keep the item name.',()=>go('items')),
  'rep-csv':el=>repExport(el.dataset.id,'csv'),
  'rep-pdf':el=>repExport(el.dataset.id,'pdf'),
  backup:()=>backup(),
  'restore-file':()=>$('#importFile').click(),
  demo:()=>loadDemo(),
  'demo-remove':()=>removeDemo(),
  erase:()=>eraseAll(),
  search:()=>openSearch(),
  remind:el=>openRemind(el),
  'share-bill':el=>openShareBill(el),
  menu:el=>openActionMenu(el),
  'more-rows':()=>{ state.limit+=LIST_PAGE; render(true); },
  'set-discard':()=>{ const f=$('#setf'); if(f) f.dataset.dirty=''; render(true); },
};
function navigate(el){
  const [v,...rest]=el.dataset.go.split(':');
  if(v==='more'){ openMore(); return; }
  state.view=v; state.id=rest.length?rest.join(':'):(el.dataset.rid||null); state.q='';
  state.filter=el.dataset.setFilter||'all';
  if(el.dataset.setPeriod) state.period=el.dataset.setPeriod;
  if(v==='items') state.itab=el.dataset.setItab||'all';
  if(v==='report') state.acct=el.dataset.setAcct||'all';
  state.limit=LIST_PAGE;
  render(true); window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-close],[data-go],[data-open],[data-act],[data-filter],[data-ptype],[data-itab],[data-acct],[data-cview]');
  if(_menu&&!(el&&el===_menuBtn)) closeMenu();
  if(!el) return;
  const ov=el.closest('.overlay');
  if(el.hasAttribute('data-close')){ closeLayer(ov); return; }
  if(el.hasAttribute('data-closefirst')&&ov) closeLayer(ov);
  const ds=el.dataset;
  if(ds.go){ navigate(el); return; }
  if(ds.open){ const [t,id]=ds.open.split(':'); if(t==='pay') openPayDetail(id); else if(t==='exp') openExpDetail(id); return; }
  if(ds.filter!=null&&!ov){ state.filter=ds.filter; state.limit=LIST_PAGE; render(true); return; }
  if(ds.ptype){ state.ptype=ds.ptype; state.limit=LIST_PAGE; render(true); return; }
  if(ds.itab&&!ov){ state.itab=ds.itab; state.limit=LIST_PAGE; render(true); return; }
  if(ds.acct){ state.acct=ds.acct; render(true); return; }
  if(ds.cview){ state.chart=ds.cview; render(true); return; }
  if(ds.act&&ACTS[ds.act]) ACTS[ds.act](el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(_menu){ const b=closeMenu(); if(b) b.focus(); e.preventDefault(); return; }
    const top=$('#layers').lastElementChild; if(top){ if(top.dataset.dismiss) closeLayer(top); else { const d=top.querySelector('[data-discard]'); if(d) d.click(); } e.preventDefault(); } return;
  }
  if((e.key==='k'||e.key==='K')&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); openSearch(); return; }
  if(e.key==='/'&&!e.target.closest('input,textarea,select,[contenteditable="true"]')&&!$('#layers').children.length){ e.preventDefault(); openSearch(); return; }
  if(_menu&&(e.key==='ArrowDown'||e.key==='ArrowUp')){ const bs=$$('button',_menu), i=bs.indexOf(document.activeElement); e.preventDefault(); bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus(); return; }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-go][tabindex],[data-open][tabindex]')&&!e.target.matches('button,a,input,select,textarea')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'&&t.closest('#app')){ state.q=t.value; state.limit=LIST_PAGE; render(true); return; }
  const sf=t.closest('#setf'); if(sf){ sf.dataset.dirty='1'; const bar=$('#savebar'); if(bar) bar.hidden=false; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='period'&&t.closest('#app')){ state.period=t.value; state.limit=LIST_PAGE; render(true); return; }
  if((t.id==='pf'||t.id==='pt')&&t.closest('#app')&&t.value){ state[t.id==='pf'?'from':'to']=t.value; render(true); return; }
  const sf=t.closest('#setf'); if(sf){ sf.dataset.dirty='1'; const bar=$('#savebar'); if(bar) bar.hidden=false; }
});
document.addEventListener('submit',e=>{ if(e.target.id==='setf'){ e.preventDefault(); saveSettingsForm(e.target); } });
window.matchMedia('(max-width:600px)').addEventListener('change',()=>{ if(state.view==='home') scheduleRender(); });

/* =========================================================
   Start
   ========================================================= */
renderShell();
render();
Store.init();
let _rz=null; window.addEventListener('resize',()=>{ clearTimeout(_rz); _rz=setTimeout(drawCharts,150); });
</script>
